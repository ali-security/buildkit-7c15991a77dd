name: seal-winint

on:
  workflow_dispatch: {}

defaults:
  run:
    shell: bash

jobs:
  test-integration-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - ./client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: false
      - name: Build buildkitd/buildctl from the patched tree
        env:
          GOFLAGS: -mod=vendor
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/buildkitd.exe" ./cmd/buildkitd
          go build -o "$RUNNER_TEMP/bin/buildctl.exe" ./cmd/buildctl
      - name: Install containerd (CONTAINERD_VERSION from the repo Dockerfile)
        run: |
          set -eux
          curl -fsSL -o "$RUNNER_TEMP/containerd.tgz" \
            https://github.com/containerd/containerd/releases/download/v1.7.18/containerd-1.7.18-windows-amd64.tar.gz
          mkdir -p "$RUNNER_TEMP/ctrd"
          tar xzf "$RUNNER_TEMP/containerd.tgz" -C "$RUNNER_TEMP/ctrd"
          find "$RUNNER_TEMP/ctrd" -name '*.exe' -exec cp {} "$RUNNER_TEMP/bin/" \;
          ls -l "$RUNNER_TEMP/bin"
      - name: Build registry.exe (REGISTRY_VERSION from the repo Dockerfile)
        run: |
          set -eux
          gp="$RUNNER_TEMP/gopath"
          mkdir -p "$gp/src/github.com/docker"
          git clone -q --depth 1 -b v2.8.3 https://github.com/distribution/distribution.git \
            "$gp/src/github.com/docker/distribution"
          cd "$gp/src/github.com/docker/distribution"
          GO111MODULE=off GOPATH="$gp" CGO_ENABLED=0 go build -o "$RUNNER_TEMP/bin/registry.exe" ./cmd/registry
          ls -l "$RUNNER_TEMP/bin/registry.exe"
      - name: Probe harness prerequisites
        run: |
          set -eux
          export PATH="$RUNNER_TEMP/bin:$PATH"
          buildkitd.exe --version
          containerd.exe --version
          registry.exe --version || true
          ls "$RUNNER_TEMP/bin"
      - name: Integration ${{ matrix.pkg }} worker=containerd
        env:
          GOFLAGS: -mod=vendor
          TMPDIR: ${{ runner.temp }}
        run: |
          set -eux
          export PATH="$RUNNER_TEMP/bin:$PATH"
          go test -v -timeout 60m -parallel 2 -run '//worker=containerd$' ${{ matrix.pkg }}
